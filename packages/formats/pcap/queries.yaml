version: '0.1'
format: pcap
queries:
  - id: overview
    title: Table overview
    kind: grid
    sql: |
      select 'packets' as table_name, count(*) as row_count from packets
      union all select 'ip', count(*) from ip
      union all select 'tcp', count(*) from tcp
      union all select 'udp', count(*) from udp
      union all select 'dns', count(*) from dns
      union all select 'icmp', count(*) from icmp
      union all select 'icmpv6', count(*) from icmpv6
      union all select 'tls', count(*) from tls
      union all select 'streams', count(*) from streams
      union all select 'stream_segments', count(*) from stream_segments
      order by table_name
      limit 100;

  - id: protocols
    title: Protocol histogram
    kind: grid
    sql: |
      select proto, count(*)
      from ip
      group by proto
      order by 2 desc
      limit 100;

  - id: dns_join
    title: DNS queries by time
    kind: grid
    # The join matches _src_file as well as packet_id: keys restart per file, so joining on
    # packet_id alone would match DNS rows against same-id packets from other files. Do not
    # "simplify" this to `using (packet_id)`. See pcap.tables.yaml and pack.test.ts for the guard.
    # `select d.*` (not explicit columns) keeps the hidden _src_* columns so rows carry byte
    # provenance in the hex viewer.
    sql: |
      select d.*, p.ts
      from dns d
      join packets p on d.packet_id = p.packet_id and d._src_file = p._src_file
      order by p.ts
      limit 100;

  - id: tcp_flows
    title: TCP flows
    kind: grid
    sql: |
      select s.stream_id, s.src_addr, s.src_port, s.dst_addr, s.dst_port,
             s.status, s.message_count, s.byte_count, s.pending_bytes
      from streams s
      order by s.stream_id
      limit 100;
