version: '0.3'
format: pcap
# Multi-file note: the `key` columns below (packet_id, ip_id, tcp_id, stream_id, …) and the
# `parent_key` references that point at them are assigned PER FILE — they restart at 1 for every
# file in a session, so they are NOT unique across files. In a multi-file session a cross-table
# join must therefore also match the provenance file, e.g.
#   dns d join packets p on d.packet_id = p.packet_id and d._src_file = p._src_file
# Joining `using (packet_id)` alone matches rows across files and inflates/mis-times the result.
# The row's true cross-file identity is the composite (_src_file, _src_start). See the presets in
# queries.yaml and docs/superpowers/specs/2026-07-20-multifile-key-identity-decision.md.
tables:
  - name: packets
    rows: $
    key: packet_id
    columns:
      ts: { expr: _.ts_sec * 1000000 + _.ts_frac_us, type: timestamp_us }
      caplen: { expr: _.incl_len, type: uint32 }
      len: { expr: _.orig_len, type: uint32 }
      linktype: { expr: _.linktype, type: uint32 }
  - name: ip
    rows: $
    key: ip_id
    parent_key: { table: packets, column: packet_id }
    columns:
      version: { expr: _.version, type: int8 }
      src_addr: { expr: '_.is_v4 ? ip4_str(_.src_addr) : ip6_str(_.src_addr)', type: utf8 }
      dst_addr: { expr: '_.is_v4 ? ip4_str(_.dst_addr) : ip6_str(_.dst_addr)', type: utf8 }
      proto: { expr: _.l4_proto, type: int16 }
      hop_limit: { expr: _.hop_limit, type: int16 }
      length: { expr: _.length, type: uint32 }
  - name: tcp
    rows: $
    key: tcp_id
    parent_key: { table: packets, column: packet_id }
    columns:
      src_port: { expr: _.src_port, type: uint16 }
      dst_port: { expr: _.dst_port, type: uint16 }
      seq: { expr: _.seq_num, type: int64 }
      ack: { expr: _.ack_num, type: int64 }
      flags: { expr: _.flags, type: utf8 }
      window: { expr: _.window_size, type: uint16 }
  - name: udp
    rows: $
    key: udp_id
    parent_key: { table: packets, column: packet_id }
    columns:
      src_port: { expr: _.src_port, type: uint16 }
      dst_port: { expr: _.dst_port, type: uint16 }
      length: { expr: _.length, type: uint16 }
  - name: dns
    rows: $.message
    key: dns_id
    parent_key: { table: packets, column: packet_id }
    columns:
      tx_id: { expr: _.transaction_id, type: uint16 }
      qr: { expr: _.qr, type: int8 }
      query_name: { expr: _.query_name, type: utf8 }
      query_type: { expr: _.query_type, type: int16 }
      qd_count: { expr: _.qdcount, type: uint16 }
      an_count: { expr: _.ancount, type: uint16 }
  - name: icmp
    rows: $
    key: icmp_id
    parent_key: { table: packets, column: packet_id }
    columns:
      type: { expr: _.icmp_type, type: int16 }
      echo_id: { expr: _.echo_id, type: uint16 }
      echo_seq: { expr: _.echo_seq, type: uint16 }
  - name: icmpv6
    rows: $
    key: icmpv6_id
    parent_key: { table: packets, column: packet_id }
    columns:
      type: { expr: _.icmp_type, type: int16 }
      code: { expr: _.code, type: int16 }
      echo_id: { expr: _.echo_id, type: uint16 }
      echo_seq: { expr: _.echo_seq, type: uint16 }
  - name: tls
    rows: $.client_hello
    key: tls_id
    parent_key: { table: packets, column: packet_id }
    columns:
      tls_version: { expr: _.tls_version, type: utf8 }
      sni: { expr: _.sni, type: utf8 }
  - name: streams
    rows: $
    key: stream_id
    columns:
      src_addr: { expr: _.src_addr, type: utf8 }
      src_port: { expr: _.src_port, type: uint16 }
      dst_addr: { expr: _.dst_addr, type: utf8 }
      dst_port: { expr: _.dst_port, type: uint16 }
      segment_count: { expr: _.segment_count, type: uint32 }
      byte_count: { expr: _.byte_count, type: uint32 }
      message_count: { expr: _.message_count, type: uint32 }
      pending_bytes: { expr: _.pending_bytes, type: uint32 }
      status: { expr: _.status, type: utf8 }
dissect:
  - from: packets
    payload: _.body
    chain:
      - { when: _.linktype == 1, parser: ethernet_frame }
      - { when: _.linktype == 228, parser: ipv4_packet, table: ip }
      - { when: _.linktype == 229, parser: ipv6_packet, table: ip }
  - from: ethernet_frame
    payload: _.body
    chain:
      - { when: _.ether_type == 0x0800, parser: ipv4_packet, table: ip }
      - { when: _.ether_type == 0x86dd, parser: ipv6_packet, table: ip }
  - from: ipv4_packet
    payload: _.body
    chain:
      - { when: _.l4_proto == 6, parser: tcp_segment, table: tcp }
      - { when: _.l4_proto == 17, parser: udp_datagram, table: udp }
      - { when: _.l4_proto == 1, parser: icmp_packet, table: icmp }
  - from: ipv6_packet
    payload: _.body
    chain:
      - { when: _.l4_proto == 6, parser: tcp_segment, table: tcp }
      - { when: _.l4_proto == 17, parser: udp_datagram, table: udp }
      - { when: _.l4_proto == 58, parser: icmpv6_packet, table: icmpv6 }
  - from: tcp
    payload: _.body
    chain:
      - { when: _.dst_port == 443 or _.src_port == 443, stream: tls_stream }
      - { when: _.dst_port == 53 or _.src_port == 53, stream: dns_tcp_stream }
  - from: udp_datagram
    payload: _.body
    chain:
      - { when: _.dst_port == 53 or _.src_port == 53, parser: dns_packet, table: dns }
streams:
  - name: tls_stream
    key: tcp_flow_key
    # Standard-forensic sequence semantics (Wireshark): the SYN consumes one sequence number,
    # so a SYN+data payload starts at seq+1. Without the +1 a SYN+data first segment leaves a
    # permanent 1-byte hole and the stream flushes 'gap', dropping every later message.
    offset: '_.seq_num + (_.syn ? 1 : 0)'
    framer: tls_record
    table: streams
    segments_table: stream_segments
    max_buffer: 1048576
    messages:
      - { when: _.offset == 0, parser: tls_client_hello, table: tls }
  - name: dns_tcp_stream
    key: tcp_flow_key
    # SYN adjustment as in tls_stream above.
    offset: '_.seq_num + (_.syn ? 1 : 0)'
    framer: dns_tcp
    table: streams
    segments_table: stream_segments
    max_buffer: 1048576
    messages:
      - { when: 'true', parser: dns_tcp_message, table: dns }
